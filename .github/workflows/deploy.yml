# Deploy to server: pulls main, builds and restarts this app on the server
# (run by the self-hosted runner installed there). Setup steps: .github/SERVER_SETUP.md
name: Deploy to server

# Button-only: runs only when started from Actions -> Deploy to server -> Run workflow.
# (To deploy on every push instead, add:  push: { branches: [main] })
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Skipped until the DEPLOY_DIR repository variable is set
    if: ${{ vars.DEPLOY_DIR != '' }}
    runs-on: [self-hosted, Windows]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      PM2_NAMES: ${{ vars.PM2_NAMES }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - name: Pull latest code into the server folder
        shell: powershell
        env:
          GIT_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          $ErrorActionPreference = 'Stop'
          # Low priority so a deploy never slows down the other apps on this server (child processes inherit it)
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'

          # ---- Safety checks: stop before touching anything if the settings look wrong ----
          $dir = "$env:DEPLOY_DIR".TrimEnd('\')
          if (-not [IO.Path]::IsPathRooted($dir) -or ($dir -split '\\').Count -lt 2 -or -not (Test-Path $dir -PathType Container)) {
              throw "DEPLOY_DIR '$env:DEPLOY_DIR' must be an existing project folder (not a drive root)"
          }
          if (-not $env:PM2_NAMES) { throw "Set the repository variable PM2_NAMES to the PM2 app name(s)" }
          $json = (cmd /c "pm2 jlist 2>nul") -join ''
          $m = [regex]::Match($json, '\[\s*(\{|\])')
          if (-not $m.Success) { throw "Could not read 'pm2 jlist' - is PM2 running for this user?" }
          Add-Type -AssemblyName System.Web.Extensions
          $ser = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $ser.MaxJsonLength = [int]::MaxValue
          $apps = @($ser.DeserializeObject($json.Substring($m.Index)) | ForEach-Object {
              [pscustomobject]@{ name = [string]$_['name']; script = [string]$_['pm2_env']['pm_exec_path'] }
          })
          foreach ($name in $env:PM2_NAMES.Split(',')) {
              $name = $name.Trim()
              if ($name -eq 'all' -or $name -match '^\d+$') { throw "PM2_NAMES must list app names, not 'all' or ids ('$name')" }
              $app = @($apps | Where-Object { $_.name -eq $name })
              if ($app.Count -ne 1) { throw "PM2 app '$name' not found (or not unique) in 'pm2 list'" }
              if (-not $app[0].script.StartsWith("$dir\", [StringComparison]::OrdinalIgnoreCase)) {
                  throw "PM2 app '$name' runs $($app[0].script), which is outside $dir - refusing to touch it"
              }
              Write-Host "Safety check OK: PM2 app '$name' runs from inside $dir"
          }
          function Git([string]$gitArgs) {
              cmd /c "git -c safe.directory=* -C `"$dir`" $gitArgs 2>&1"
              if ($LASTEXITCODE -ne 0) { throw "git command failed (exit $LASTEXITCODE)" }
          }

          $isNew = -not (Test-Path (Join-Path $dir '.git'))
          $origin = ''
          if (-not $isNew) {
              $url = cmd /c "git -c safe.directory=* -C `"$dir`" remote get-url origin 2>nul"
              if ($url) { $origin = "$url".Trim() }
          }
          if ($origin -ne $env:REPO_URL) {
              # First deploy from this repo (plain folder, or a git folder linked to another repo):
              # back up the existing folder (minus node_modules), then point it at this repo
              if (Test-Path $dir) {
                  $backup = "$($dir.TrimEnd('\'))_backup_$(Get-Date -Format yyyyMMdd_HHmmss)"
                  robocopy $dir $backup /E /XD node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
                  if ($LASTEXITCODE -ge 8) { throw "Backup of $dir failed (robocopy exit $LASTEXITCODE)" }
                  Write-Host "Backed up existing folder to $backup"
              } else {
                  New-Item -ItemType Directory -Path $dir | Out-Null
              }
              if ($isNew) { Git "init -q" }
              if ($origin) { Git "remote set-url origin $env:REPO_URL" } else { Git "remote add origin $env:REPO_URL" }
              Write-Host "Linked $dir to $env:REPO_URL (was: $(if ($origin) { $origin } else { 'not a git folder' }))"
          }

          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GIT_TOKEN"))
          Write-Host "::add-mask::$b64"
          $prev = cmd /c "git -c safe.directory=* -C `"$dir`" rev-parse --verify -q HEAD 2>nul"
          Git "-c http.extraheader=`"AUTHORIZATION: basic $b64`" fetch -q --depth 1 origin main"
          # Only tracked files change; .env, appsettings.json, uploads and node_modules are left alone
          Git "reset -q --hard FETCH_HEAD"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PREV_SHA=$prev`n")
          Git "log -1 --format=`"Deployed %h - %s`""

      - name: Install, build and restart
        shell: powershell
        run: '& (Join-Path $env:DEPLOY_DIR ".github\deploy.ps1")'
